<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Supervision des équipements - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Connexion</h1>

    <!--/* F1 -- Spring Security renvoie sur /connexion?erreur quand le login ou le mot de passe est faux : la même page est réaffichée avec ce message. */-->
    <div th:if="${param.erreur}" class="alert alert-danger w-50">Login ou mot de passe incorrect.</div>
    <div th:if="${param.deconnexion}" class="alert alert-info w-50">Vous êtes déconnecté.</div>

    <!--/* Les noms "username" et "password" sont ceux qu'attend Spring Security par défaut. */-->
    <form th:action="@{/connexion}" method="POST">
        <label class="form-label" for="username">Login</label>
        <input type="text" id="username" name="username" class="form-control mb-3 w-50" required autofocus>

        <label class="form-label" for="password">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-control mb-3 w-50" required>

        <button type="submit" class="btn btn-primary">Connectez-vous</button>
    </form>
</div>
</body>
</html>
