<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* F1 -- En-tête affiché en haut de chaque page une fois connecté : navigation à gauche, utilisateur à droite.
       La déconnexion passe par un formulaire POST vers /logout (URL par défaut de Spring Security), présenté comme un lien.
       Les liens réservés au responsable sont seulement masqués ici : la restriction réelle est appliquée par les services (RG11). */-->
<header th:fragment="entete" th:if="${utilisateurConnecte}" class="navbar navbar-expand bg-body-tertiary border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Supervision des équipements</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item" th:if="${utilisateurConnecte.estResponsable()}">
                <a class="nav-link" th:href="@{/supervision}">Tableau de bord</a>
            </li>
            <li class="nav-item"><a class="nav-link" th:href="@{/reseau}">Réseau</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/incidents/historique}">Historique</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/swagger-ui.html}">API</a></li>
        </ul>
        <form th:action="@{/logout}" method="POST" class="d-flex align-items-center">
            <span th:text="|Bonjour ${utilisateurConnecte.prenom} (${utilisateurConnecte.profil.libelle})|"></span>&nbsp;|&nbsp;
            <button type="submit" class="btn btn-link p-0">Déconnectez-vous</button>
        </form>
    </div>
</header>
</body>
</html>
