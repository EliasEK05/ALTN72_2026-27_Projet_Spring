spring.application.name=TpFilRouge

# Les identifiants de la base ne sont jamais versionnés : ils viennent des variables d'environnement
# ou du fichier local application-local.properties (ignoré par Git, voir application-local.properties.example).
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/altyn72_supervision}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5.10.2 / 5.10.3 (note technique 3) -- Un formulaire HTML ne sait envoyer que GET et POST, or notre API utilise aussi PUT et DELETE.
# Cette propriété active le HiddenHttpMethodFilter de Spring MVC : il lit le champ caché "_method" du formulaire (valeur PUT ou DELETE)
# et fait comme si la requête POST avait cette méthode. Désactivé par défaut : sans cette ligne, "Supprimez" et "Modifiez" donnent une erreur 405.
spring.mvc.hiddenmethod.filter.enabled=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
